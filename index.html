
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">

  <title>Khata-Rist | My Socials</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</head>

<body>

  <main class="profile">

    <!-- Language Switcher -->
    <div class="language-switcher">

      <button class="lang-btn active" data-lang="en">
        🇺🇸 English
      </button>

      <button class="lang-btn" data-lang="ja">
        🇯🇵 日本語
      </button>

    </div>


    <!-- Profile -->
    <a href="about.html" class="profile-link">

      <img
        src="Kha.jpeg"
        alt="Khata-Rist profile"
        class="avatar">

    </a>

    <h1>Khata-Rist</h1>

    <p class="bio"
      data-en="Music • Anime • Creativity ✨"
      data-ja="音楽 • アニメ • クリエイティブ ✨">

      Music • Anime • Creativity ✨

    </p>


    <!-- Social Media -->
    <nav class="socials" aria-label="Social media links">

      <a href="https://www.youtube.com/@khatori98"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        class="youtube">

        <i class="fa-brands fa-youtube"></i>

      </a>


      <a href="https://www.tiktok.com/@khatori4"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        class="tiktok">

        <i class="fa-brands fa-tiktok"></i>

      </a>


      <a href="https://www.instagram.com/nabinkhatri_"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
        class="instagram">

        <i class="fa-brands fa-instagram"></i>

      </a>


      <a href="https://www.facebook.com/nndyjamesk"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
        class="facebook">

        <i class="fa-brands fa-facebook"></i>

      </a>

    </nav>



<!-- My Videos -->
<section class="videos-section">

  <h2>
    <span data-en="My Videos" data-ja="私の動画">
      My Videos
    </span>
    <i class="fa-solid fa-play"></i>
  </h2>

  <div class="video-scroll">

    <!-- Video 1 -->
    <article class="video-card">

      <video controls playsinline preload="metadata">
        <source
          src="Deepak%20Moktan%20Guitar%20Competition%202018%20Solo%20By%20Me.mp4"
          type="video/mp4">
        Your browser does not support video playback.
      </video>

      <p
        data-en="Deepak Moktan Guitar Competition 2018 Solo By Me"
        data-ja="2018年 ディーパク・モクタン・ギターコンテスト ソロ演奏">
        Deepak Moktan Guitar Competition 2018 Solo By Me
      </p>

    </article>

    <!-- Video 2 -->
    <article class="video-card">

      <video controls playsinline preload="metadata">
        <source
          src="A%20Decade%20of%20Tone.mp4"
          type="video/mp4">
        Your browser does not support video playback.
      </video>

      <p
        data-en="A Decade of Tone"
        data-ja="10年間の音色">
        A Decade of Tone
      </p>

    </article>

</section>




    <!-- My Creations -->
    <section class="section" id="projects">


      <h2 class="section-heading">

        ←

        <span data-en="MY CREATIONS" data-ja="私の作品">
          MY CREATIONS
        </span>

        →

      </h2>


      <div class="cards">


        <!-- Music Projects -->
        <a
          class="project"
          href="https://www.youtube.com/@khatori98"
          target="_blank"
          rel="noopener noreferrer">

          <img src="music.jpg" alt="Music Projects">


          <div class="project-info">

            <h3>

              <span data-en="Music" data-ja="音楽">
                Music
              </span>

              <br>

              <span data-en="Projects" data-ja="プロジェクト">
                Projects
              </span>

            </h3>

            <span class="number">01</span>

          </div>

        </a>



        <!-- Web Design -->
        <a class="project" href="webpage.html">

          <img src="web.jpg" alt="Web Design">


          <div class="project-info">

            <h3>

              <span data-en="Web" data-ja="ウェブ">
                Web
              </span>

              <br>

              <span data-en="Design" data-ja="デザイン">
                Design
              </span>

            </h3>

            <span class="number">02</span>

          </div>

        </a>



        <!-- Video Editing -->
        <a class="project" href="video.html">

          <img src="logo.png.png" alt="Video Editing">


          <div class="project-info">

            <h3>

              <span data-en="Video" data-ja="動画">
                Video
              </span>

              <br>

              <span data-en="Editing" data-ja="編集">
                Editing
              </span>

            </h3>

            <span class="number">03</span>

          </div>

        </a>



        <!-- Anime Creations -->
        <a
          class="project"
          href="https://www.instagram.com/just_you_n_me9823/"
          target="_blank"
          rel="noopener noreferrer">

          <img src="anime.jpg" alt="Anime Creations">


          <div class="project-info">

            <h3>

              <span data-en="Anime" data-ja="アニメ">
                Anime
              </span>

              <br>

              <span data-en="Creations" data-ja="制作">
                Creations
              </span>

            </h3>

            <span class="number">04</span>

          </div>

        </a>


      </div>

    </section>



    <!-- Footer -->
    <footer class="footer">

      <span data-en="Made with" data-ja="愛を込めて制作">
        Made with
      </span>

      <i class="fa-solid fa-heart"></i>

      <span data-en="by Khata-Rist" data-ja="Khata-Rist">
        by Khata-Rist
      </span>

    </footer>


  </main>

</body>
</html>
