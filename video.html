  <title>Khata-Rist | Video Editing</title>

  <style>
    /* ===== VIDEO EDITING PAGE ===== */

    .editing-page {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    /* ===== LANGUAGE SWITCHER ===== */

    .language-switcher {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 20px auto 30px;
    }

    .lang-btn {
      padding: 10px 20px;
      border: 1px solid #555;
      border-radius: 30px;
      background: #292929;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn:hover {
      background: #444;
      transform: translateY(-3px);
    }

    .lang-btn.active {
      background: #20c965;
      border-color: #20c965;
      color: white;
      font-weight: bold;
    }

    /* ===== BACK BUTTON ===== */

    .back-link {
      display: inline-block;
      color: #c4b5ff;
      text-decoration: none;
      margin-bottom: 30px;
      transition: 0.3s;
    }

    .back-link:hover {
      color: white;
      transform: translateX(-5px);
    }

    /* ===== TITLE ===== */

    .editing-title {
      text-align: center;
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: white;
    }

    .editing-description {
      text-align: center;
      color: #b8b8c2;
      margin-bottom: 35px;
    }

    /* ===== VIDEO GRID ===== */

    .editing-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 25px;
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 15px;
    }

    .editing-card {
      flex: 0 1 350px;
      width: calc(50% - 13px);
      min-width: 0;
      max-width: 350px;
      padding: 10px;
      background: rgba(43, 43, 48, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      text-align: center;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }

    .editing-card:hover {
      transform: translateY(-5px);
      border-color: #a78bfa;
    }

    .video-player {
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 12px;
      background: #080808;
    }

.video-player video {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
  object-fit: contain;
  background: #080808;
}
    .editing-card h2 {
      color: white;
      font-size: 16px;
      padding: 14px 5px 5px;
      text-align: center;
    }

    /* ===== FOOTER ===== */

    .editing-page .footer {
      text-align: center;
      margin-top: 45px;
      color: #b8b8c2;
    }

    .editing-page .footer .fa-heart {
      color: #ff5c85;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 600px) {
      .editing-page {
        padding: 22px 15px 40px;
      }

      .editing-grid {
        flex-direction: column;
        align-items: center;
      }

      .editing-card {
        flex: none;
        width: 100%;
        max-width: 350px;
      }
    }
  </style>
</head>

<body>
